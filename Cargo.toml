[workspace]
resolver = "2"
members = [
    "crates/memora-core",
    "crates/memora-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["The memora authors"]
repository = "https://github.com/harshtripathi272/memora"
homepage = "https://github.com/harshtripathi272/memora"
description = "The memory layer for AI agents — versioned, typed, portable."

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Hashing & time
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
indicatif = "0.17"

# Misc
uuid = { version = "1", features = ["v4"] }
dirs = "5"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
